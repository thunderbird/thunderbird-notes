release:
  release_date: '2026-11-30'
  text: >
    **These notes apply to Thunderbird for Android version 26.0 released November 30th, 2026.**

  releases:
    - version: '26.0'
      release_date: '2026-11-30'

notes:
  # New
  - note: Remote feature flags can be viewed and managed in General Settings
    short_note: Remote feature flags can be managed in settings
    pull_requests: [11693]
    issues: [11457]
    tag: new

  # Changed
  - note: Android 6 is no longer supported; Android 7 or newer is required
    short_note: Android 7 or newer is now required
    pull_requests: [11743]
    issues: [11545]
    tag: changed
  - note: Manage Folders settings moved from account drawer to Account settings under Folders
    short_note: Manage Folders moved to Account settings
    pull_requests: [11699]
    issues: [11679]
    tag: changed
  - note: Folder display, sync, and notification settings are split into separate menus
    short_note: Folder settings are split into separate menus
    pull_requests: [11755]
    issues: [11763]
    tag: changed
  - note: Modernized 'Sending Mail' settings screen
    short_note: Modernized 'Sending Mail' settings screen
    pull_requests: [11584]
    issues: [11041]
    tag: changed

  # Fixed
  - note: Thunderbird for Android could crash when opening the message view
    short_note: App could crash when opening the message view
    pull_requests: [11871]
    issues: [11869]
    tag: fixed
  - note: Thunderbird for Android crashed when the unread widget updated related account data
    short_note: Unread widget could crash the app
    pull_requests: [11906]
    issues: [11900]
    tag: fixed
  - note: Some HTML emails with malformed markup were not parsed or displayed correctly
    short_note: Some malformed HTML emails displayed incorrectly
    pull_requests: [11903]
    issues: [11877]
    tag: fixed
  - note: Account profile avatars were not imported from K-9 Mail
    short_note: Account profile avatars were not imported from K-9 Mail
    pull_requests: [11551]
    issues: [10864]
    tag: fixed
