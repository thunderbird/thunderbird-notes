name: Validate Notes Keys

on:
  pull_request:
    paths:
      - 'android_beta/*.yml'
      - 'android_release/*.yml'
      - 'beta/*.yml'
      - 'esr/*.yml'
      - 'release/*.yml'
      - 'tools/validate_notes_keys.py'
      - '.github/workflows/validate-keys.yml'
  push:
    branches:
      - master
    paths:
      - 'android_beta/*.yml'
      - 'android_release/*.yml'
      - 'beta/*.yml'
      - 'esr/*.yml'
      - 'release/*.yml'
      - 'tools/validate_notes_keys.py'
      - '.github/workflows/validate-keys.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate `notes` keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate YAML notes keys
        run: |
          python tools/validate_notes_keys.py
