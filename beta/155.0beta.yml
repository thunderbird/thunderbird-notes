release:
  release_date: '2026-08-19'
  text: |
    **These notes apply to Thunderbird version 155 beta 4 released August 26, 2026.**

    **System Requirements:** [Details](/en-US/thunderbird/154.0beta/system-requirements/)

    - Windows: Windows 10 or later
    - Mac: macOS 10.15 or later
    - Linux: GTK+ 3.14 or higher

  import_system_requirements: 153.0beta

  groups:
    - ' '
    - 'Fixed in beta 2'
    - 'Fixed in beta 3'
    - 'Fixed in beta 4'

notes:
  # New
  - note: S/MIME popup shows signature, digest, encryption algorithms and key sizes
    tag: new
    bugs: [229724]
  - note: "Default address book for manually added contacts configurable with `mail.addr_book.add_item_default_uri`"
    tag: new
    bugs: [1735630]
  - note: Enterprise policy can disable QR export
    tag: new
    bugs: [1991259]
  - note: OAuth add-ons can override built-in settings for selected domains and hostnames
    tag: new
    bugs: [2055286]
  - note: Manual account config streamlined with Exchange, Graph, and custom OAuth support
    tag: new
    bugs: [2055078]
  - note: Custom OAuth support for IMAP and SMTP servers
    tag: new
    bugs: [2053191]
  - note: PKCE and external browser fields added to custom OAuth settings
    tag: new
    bugs: [2056958]
  - note: Enterprise policy for disabling experimental features
    tag: new
    bugs: [2062407]

  # Fixed
