release:
  release_date: '2026-08-31'
  text: |
    **These notes apply to Thunderbird version 156 beta 1 released August 31, 2026.**

    **System Requirements:** [Details](/en-US/thunderbird/154.0beta/system-requirements/)

    - Windows: Windows 10 or later
    - Mac: macOS 10.15 or later
    - Linux: GTK+ 3.14 or higher

  import_system_requirements: 153.0beta

  groups:
    - ' '

notes:
  # New
  - note: OpenPGP key properties can print debug information to the Error Console
    tag: new
    bugs: [1731211]
  - note: External browser login flow enabled for Yandex
    tag: new
    bugs: [2044684]
  - note: Custom OAuth support for issuer ID and client secret field for IMAP and POP3
    tag: new
    bugs: [2063056]
  - note: Custom OAuth support for POP3
    tag: new
    bugs: [2061466]
  - note: 'Enterprise policy `DisableUpdateSettings` prevents users from changing update
      settings'
    tag: new
    bugs: [2063703]
  - note: 'Enterprise policy `DisableDataCollectionSettings` prevents users from changing
      data collection setting'
    tag: new
    bugs: [2063705]
  - note: 'Enterprise policy `DisableMessageForwardingFilters` prevents message filters
      from automatically forwarding messages'
    tag: new
    bugs: [2066092]

  # Changed
  - note: Preference '`mail.offer_experimental_features` renamed to
      `mail.experimental_features_settings.enabled`'
    tag: changed
    bugs: [2066216]

  # Fixed
  - note: 'Detached attachment links were truncated when folder path contained `&`'
    tag: fixed
    bugs: [2060451]
  - note: POP3 folders with names over 55 characters could become duplicated after upgrading
    tag: fixed
    bugs: [2029781]
  - note: Folders with invalid filename characters could show hashed names if cache was lost
    tag: fixed
    bugs: [2063333]
  - note: Save All, Detach All, and Delete All failed after deleting one attachment
    tag: fixed
    bugs: [2057025]
  - note: Renaming folders could reset folder settings
    tag: fixed
    bugs: [2060192]
  - note: Subscribing an IMAP folder and subfolder together failed to subscribe the subfolder
    tag: fixed
    bugs: [2060763]
  - note: Some newly fetched POP messages were not marked with new star after startup
    tag: fixed
    bugs: [2063838]
  - note: Sorting after deleting the only child message removed the parent from view
    tag: fixed
    bugs: [2065806]
  - note: OpenPGP signing failed with external GnuPG when the primary key could not sign
    tag: fixed
    bugs: [2026356]
  - note: Remote content could load in encrypted messages opened from files
    tag: fixed
    bugs: [2052070]
  - note: Sent message with expired S/MIME certificate wrongly showed untrusted CA warning
    tag: fixed
    bugs: [1879263]
  - note: PDF attachments from compose windows could wrongly be detected as HTML
    tag: fixed
    bugs: [1698140]
  - note: 'Saving unconfirmed recipients could create invalid address pills with `>>`'
    tag: fixed
    bugs: [1787958]
  - note: External browser OAuth failed when a browser preconnection closed first
    tag: fixed
    bugs: [2060544]
  - note: Pressing Enter on Windows system tray icon did not restore Thunderbird window
    tag: fixed
    bugs: [2064593]
  - note: Inline attachments incorrectly changed the message channel content type
    tag: fixed
    bugs: [2064295]
  - note: Message loading was slow while discovering large numbers of IMAP folders
    tag: fixed
    bugs: [2000913]
  - note: SMTP authentication failed when usernames contained non-ASCII characters
    tag: fixed
    bugs: [2056491]
  - note: Unsupported EWS archive folder prevented all mailbox folders from syncing
    tag: fixed
    bugs: [2064890]
  - note: Case differences in CalDAV email addresses caused duplicate invitations
    tag: fixed
    bugs: [1889607]
  - note: Accepted CalDAV invitations could be saved to the wrong calendar
    tag: fixed
    bugs: [2016999]
  - note: Visual and UX improvements
    tag: fixed
    bugs: [1776193, 2007529, 2059950, 2060192, 2061119, 2061484, 2062537, 2063661, 2064611]
