release:
  release_date: '2026-08-11'
  text: |
    **For help and a quick start on Thunderbird 153, see
    [Thunderbird 153 Meadow FAQ](https://support.mozilla.org/en-US/kb/new-thunderbird-desktop)**

    **For more on all the new features in Thunderbird 153, see
    [What’s New in Thunderbird 153](https://updates.thunderbird.net/thunderbird/153.0/whatsnew/).**

    **System Requirements:** [Details](/en-US/thunderbird/153.0esr/system-requirements/)

    - Windows: Windows 10 or later
    - Mac: macOS 10.15 or later
    - Linux: GTK+ 3.14 or higher

  import_system_requirements: '153.0esr'

notes:
  # Fixed
  - note: Dragging attachments from Local Folders to the desktop failed on Windows
    tag: fixed
    bugs: [2060748]
  - note: IMAP tags did not sync automatically across clients
    tag: fixed
    bugs: [1865651]
  - note: DisablePasswordReveal policy failed to prevent revealing saved passwords
    tag: fixed
    bugs: [2058522]
  - note: Thunderbird could crash when saving a sent Exchange message
    tag: fixed
    bugs: [2061208]
