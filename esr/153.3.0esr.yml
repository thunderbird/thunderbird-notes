release:
  release_date: '2026-09-15'
  text: |
    **For help and a quick start on Thunderbird 153, see
    [Thunderbird 153 Meadow FAQ](https://support.mozilla.org/en-US/kb/new-thunderbird-desktop)**

    **For more on all the new features in Thunderbird 153, see
    [What’s New in Thunderbird 153](https://updates.thunderbird.net/thunderbird/153.0/whatsnew/).**

    **System Requirements:** [Details](/en-US/thunderbird/153.0esr/system-requirements/)

    - Windows: Windows 10 or later
    - Mac: macOS 10.15 or later
    - Linux: GTK+ 3.14 or higher

  import_system_requirements: '153.0esr'

notes:
  # Fixed
  - note: 'Detached attachment links were truncated when folder path contained `&`'
    tag: fixed
    bugs: [2060451]
  - note: Save All, Detach All, and Delete All failed after deleting one attachment
    tag: fixed
    bugs: [2057025]
  - note: Blank 1970-dated messages could appear from incomplete message file copies
    tag: fixed
    bugs: [209501]
  - note: Forwarded messages could display incorrect encoding
    tag: fixed
    bugs: [2059963]
  - note: Manual Get Messages failed after startup until toggling offline mode
    tag: fixed
    bugs: [2057431]
  - note: '[Security fixes](https://www.mozilla.org/en-US/security/known-vulnerabilities/thunderbird/#thunderbird153.3)'
    tag: fixed
