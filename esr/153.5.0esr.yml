release:
  release_date: '2026-10-13'
  text: |
    **For help and a quick start on Thunderbird 153, see
    [Thunderbird 153 Meadow FAQ](https://support.mozilla.org/en-US/kb/new-thunderbird-desktop)**

    **For more on all the new features in Thunderbird 153, see
    [What’s New in Thunderbird 153](https://updates.thunderbird.net/thunderbird/153.0/whatsnew/).**

    **System Requirements:** [Details](/en-US/thunderbird/153.0esr/system-requirements/)

  import_system_requirements: '153.0esr'

notes:
  # Fixed
  - note: Attach File dialog failed to open when the previously used folder was unavailable
    tag: fixed
    bugs: [2077590]
  - note: Troubleshooting falsely reported crash reports were not configured when available
    tag: fixed
    bugs: [2070966]
  - note: Switching to Unified Folders could leave All Folders enabled and not change view
    tag: fixed
    bugs: [2041038]
  - note: 'Archived Inbox folders ignored localized names and appeared as "INBOX"'
    tag: fixed
    bugs: [2062951]
  - note: Plain-text inline forwards omitted signatures placed below the quote
    tag: fixed
    bugs: [2063939]
  - note: '[Security fixes](https://www.mozilla.org/en-US/security/known-vulnerabilities/thunderbird/#thunderbird153.5)'
    tag: fixed
