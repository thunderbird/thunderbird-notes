release:
  release_date: '2026-09-29'
  text: |
    **For help and a quick start on Thunderbird 153, see
    [Thunderbird 153 Meadow FAQ](https://support.mozilla.org/en-US/kb/new-thunderbird-desktop)**

    **For more on all the new features in Thunderbird 153, see
    [What’s New in Thunderbird 153](https://updates.thunderbird.net/thunderbird/153.0/whatsnew/).**

    **System Requirements:** [Details](/en-US/thunderbird/153.0esr/system-requirements/)

  import_system_requirements: '153.0esr'

notes:
  # Changed
  - note: RNP command-line utilities are no longer included with Thunderbird
    tag: changed
    bugs: [2068130]
  - note: Thundermail built-in add-on updated to v2.0.16
    tag: changed
    bugs: [2071989]

  # Fixed
  - note: Ctrl+Shift+K could fail to open the Quick Filter UI
    tag: fixed
    bugs: [2062942]
  - note: Message list could show the wrong sender for messages
    tag: fixed
    bugs: [2069089]
  - note: Nested S/MIME signed parts could fail to render
    tag: fixed
    bugs: [2062971]
  - note: Thunderbird could hang when waiting for IMAP server greeting during account setup
    tag: fixed
    bugs: [2028760]
  - note: Gmail OAuth2 authentication could intermittently fail on Windows
    tag: fixed
    bugs: [2063816]
  - note: '`AppUpdatePin` policy did not prevent Thunderbird from updating beyond pinned version'
    tag: fixed
    bugs: [1910603]
  - note: "\"What's New?\" linked to Release channel notes instead of ESR release notes"
    tag: fixed
    bugs: [2073813]
  - note: '[Security fixes](https://www.mozilla.org/en-US/security/known-vulnerabilities/thunderbird/#thunderbird153.4)'
    tag: fixed
